name: Test

# push with no branch filter meant every commit on a PR branch ran this twice:
# once for the push, once for the pull_request. main only, and the PR trigger
# covers everything else.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet and test
        env:
          CONNECT_TEST_DSN: postgres://postgres:postgres@localhost:5432/connect_test?sslmode=disable
        run: |
          go vet ./...
          go test -count=1 -v ./... 2>&1 | tee test-output.txt
      - name: Refuse a skipped DB suite
        run: |
          if grep -q "CONNECT_TEST_DSN not set" test-output.txt; then exit 1; fi
